[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Serverless functions (e.g. the OpenAI proxy at /.netlify/functions/openai).
# Reads secrets like OPENAI_API_KEY from the environment, never from the client bundle.
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  # sharp is a native add-on. Keep its package structure intact so Netlify's Linux build installs
  # and ships the linux-x64 binary instead of esbuild producing a bundle without a usable runtime.
  external_node_modules = ["sharp"]

# Build assets must NEVER fall through to the SPA shell. Without this rule a
# request for a chunk that no longer exists (tab open across a deploy) is
# answered by the catch-all below with index.html and HTTP 200 — and because
# /assets/* is cached `immutable` for a year, the browser would then cache an
# HTML document under a .js URL, poisoning that filename for anyone who later
# gets the same content hash (a revert restores it). A real 404 keeps the
# failure honest and lets the chunk-error handling show its reload prompt.
[[redirects]]
  from = "/assets/*"
  to = "/index.html"
  status = 404

# SPA fallback: prerendered marketing routes (dist/<path>/index.html) and real files are served
# directly; any other path (e.g. the in-app /app screens) falls back to the client shell.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security headers for every response. The enforcing set below is safe for this
# app (no same-origin iframing of itself; secrets live only in functions). The
# Content-Security-Policy ships in REPORT-ONLY first: Netlify headers can only be
# exercised on a real deploy, so enforcing a CSP we cannot verify locally could
# break fonts / Supabase / Stripe. Verify zero violations on a branch preview,
# then rename `Content-Security-Policy-Report-Only` -> `Content-Security-Policy`.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), browsing-topics=()"
    Cross-Origin-Opener-Policy = "same-origin-allow-popups"
    # Origins the client actually contacts: Google Fonts (CSS + font files),
    # Supabase (auth/db/storage/realtime over https + wss), same-origin Netlify
    # functions (the OpenAI proxy, Stripe session creation), Stripe (checkout is
    # a top-level redirect; js.stripe.com allowed for future embedded flows),
    # and data:/blob: images (SVG course tiles, generated assets).
    Content-Security-Policy-Report-Only = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; img-src 'self' data: blob: https://*.supabase.co; font-src 'self' data: https://fonts.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; script-src 'self'; connect-src 'self' https://*.supabase.co wss://*.supabase.co; frame-src 'self' https://js.stripe.com; form-action 'self' https://checkout.stripe.com https://billing.stripe.com; manifest-src 'self'; worker-src 'self' blob:; upgrade-insecure-requests"

# Build assets are content-hashed (index-<hash>.js), so a given URL's bytes never
# change — cache them for a year and skip revalidation entirely. Without this the
# browser re-checks every chunk on every load, which cancels out code-splitting:
# more chunks would mean more revalidation round-trips, not fewer bytes.
# index.html itself is NOT covered here and stays revalidated, so a deploy is
# picked up immediately and points at the new hashed chunks.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Keep the in-app screens out of the search index (their content lives behind navigation/auth).
[[headers]]
  for = "/app"
  [headers.values]
    X-Robots-Tag = "noindex"

[[headers]]
  for = "/app/*"
  [headers.values]
    X-Robots-Tag = "noindex"
